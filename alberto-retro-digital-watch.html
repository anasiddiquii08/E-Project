<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alberto Clock Retro Digital</title>
<style>
html,body{height:100%;margin:0;overflow:hidden;background:#000}
body{display:flex;align-items:center;justify-content:center;font-family:Georgia,"Times New Roman",serif}
.stage{width:97%;height:96vh;box-sizing:border-box;background:radial-gradient(ellipse at 50% 45%,#1a1d20 0%,#000 64%);border:1px solid #23282c;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:1vh 1rem 3vh;overflow:hidden}
svg{height:78vh;width:auto;max-width:90%;filter:drop-shadow(0 25px 50px rgba(190,205,220,.18))}
h1{margin:0;font-weight:300;font-size:clamp(1.5rem,4.4vh,2.7rem);letter-spacing:.3em;color:#c9d2d9;text-align:center}
</style></head><body>
<main class="stage">
<svg viewBox="0 0 400 600" role="img" aria-label="Retro digital watch showing live time">
<defs>
<linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f6f8"/><stop offset=".45" stop-color="#9aa3aa"/><stop offset=".7" stop-color="#dfe4e8"/><stop offset="1" stop-color="#6b747b"/></linearGradient>
<linearGradient id="link" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9edf0"/><stop offset=".5" stop-color="#aab2b8"/><stop offset="1" stop-color="#7c858c"/></linearGradient>
<linearGradient id="lcd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c4cbb4"/><stop offset="1" stop-color="#a9b199"/></linearGradient>
<radialGradient id="btn" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#f4f6f8"/><stop offset="1" stop-color="#7f888f"/></radialGradient>
</defs>
<g id="links"></g>
<polygon points="108,128 292,128 322,158 322,442 292,472 108,472 78,442 78,158" fill="url(#steel)"/>
<polygon points="116,138 284,138 308,162 308,438 284,462 116,462 92,438 92,162" fill="#2b3035"/>
<polygon points="124,146 276,146 298,168 298,432 276,454 124,454 102,432 102,168" fill="#0a0a0a"/>
<text x="124" y="176" fill="#e8e8e8" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">ALBERTO</text>
<rect x="238" y="162" width="36" height="17" rx="5" fill="none" stroke="#e8e8e8" stroke-width="1.2"/>
<text x="256" y="175" text-anchor="middle" fill="#e8e8e8" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700">WR</text>
<g font-family="Arial,Helvetica,sans-serif" font-size="8.5" font-weight="700">
<text x="124" y="193" fill="#4fd36b">MONTH</text><text x="178" y="193" fill="#4fd36b">DATE</text><text x="244" y="193" fill="#4fd36b">DAY</text>
<text x="124" y="205" fill="#e8e8e8">M</text><text x="190" y="205" fill="#e8e8e8">S</text><text x="248" y="205" fill="#e8e8e8">1/10</text>
<text x="124" y="217" fill="#e8e8e8">H</text><text x="160" y="217" fill="#e8e8e8">M</text><text x="198" y="217" fill="#e8e8e8">S</text>
</g>
<rect x="116" y="224" width="168" height="62" rx="3" fill="#c9ccd0"/>
<rect x="120" y="228" width="160" height="54" rx="2" fill="url(#lcd)"/>
<text x="124" y="242" fill="#2a2e22" font-family="Arial,sans-serif" font-size="9" font-weight="700" id="ampm">P</text>
<g id="lcdg" transform="translate(0 0)"></g>
<text x="200" y="302" text-anchor="middle" fill="#cfd4d8" font-family="Arial,sans-serif" font-size="8" font-weight="700" letter-spacing="2">QUARTZ</text>
<rect x="104" y="316" width="192" height="124" rx="26" fill="#000"/>
<g id="btns"></g>
</svg>
<h1>ALBERTO CLOCK</h1>
</main>
<script>
(function(){
var ns="http://www.w3.org/2000/svg";
function el(n,a,p){var e=document.createElementNS(ns,n);for(var k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e}
var L=document.getElementById("links");
for(var i=0;i<5;i++){
  el("rect",{x:132,y:4+i*24,width:136,height:20,rx:2,fill:"url(#link)"},L);
  el("rect",{x:132,y:478+i*24,width:136,height:20,rx:2,fill:"url(#link)"},L);
}
el("rect",{x:116,y:110,width:168,height:18,rx:3,fill:"url(#link)"},L);
el("rect",{x:116,y:472,width:168,height:18,rx:3,fill:"url(#link)"},L);
var B=document.getElementById("btns");
[[130,342],[270,342],[130,414],[270,414]].forEach(function(p){
  el("circle",{cx:p[0],cy:p[1],r:13,fill:"#1a1d20"},B);
  el("circle",{cx:p[0],cy:p[1],r:11,fill:"url(#btn)"},B);
});
[[200,342,"#9a9a9a"],[240,342,"#e6b800"],[160,414,"#c8283c"],[240,414,"#1f9a4a"]].forEach(function(d){
  el("rect",{x:d[0]-17,y:d[1]-3,width:34,height:5,rx:2,fill:d[2]},B);
});
[[150,342,"#9a9a9a"],[240,342,"#e6b800"],[170,414,"#c8283c"],[230,414,"#1f9a4a"]];
var G=document.getElementById("lcdg");
var SEG={0:"abcdef",1:"bc",2:"abdeg",3:"abcdg",4:"bcfg",5:"acdfg",6:"acdefg",7:"abc",8:"abcdefg",9:"abcdfg"};
function mk(x,y,w,h,t){
  var g=el("g",{transform:"translate("+x+" "+y+") skewX(-7)"},G),h2=h/2,s={};
  var d={a:[3,0,w-6,t],g:[3,h2-t/2,w-6,t],d:[3,h-t,w-6,t],f:[0,3,t,h2-4],b:[w-t,3,t,h2-4],e:[0,h2+1,t,h2-4],c:[w-t,h2+1,t,h2-4]};
  for(var k in d){s[k]=el("rect",{x:d[k][0],y:d[k][1],width:d[k][2],height:d[k][3],fill:"#2a2e22",opacity:.07},g)}
  return {set:function(v){for(var k in s)s[k].setAttribute("opacity",(v!==null&&SEG[v].indexOf(k)>=0)?1:.07)}};
}
var d1=mk(130,240,20,36,4.5),d2=mk(156,240,20,36,4.5),d3=mk(190,240,20,36,4.5),d4=mk(216,240,20,36,4.5),s1=mk(246,254,13,22,3.2),s2=mk(264,254,13,22,3.2);
el("rect",{x:181,y:252,width:4,height:4,fill:"#2a2e22"},G);el("rect",{x:181,y:264,width:4,height:4,fill:"#2a2e22"},G);
var AP=document.getElementById("ampm");
function tick(){
  var n=new Date(),h=n.getHours(),m=n.getMinutes(),s=n.getSeconds(),pm=h>=12;h=h%12;if(h===0)h=12;
  d1.set(h>=10?Math.floor(h/10):null);d2.set(h%10);d3.set(Math.floor(m/10));d4.set(m%10);
  s1.set(Math.floor(s/10));s2.set(s%10);
  AP.textContent=pm?"P":"";
  requestAnimationFrame(tick);
}
tick();
})();
</script></body></html>
